<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Productivity app</title>
<meta name="description" content="Timetable, attendance, deadlines, focus timer, gym, food and daily goals in one place.">
<meta name="theme-color" content="#14111F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Productivity">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Dark by default. Colours mean the same thing everywhere: cyan (--ink) is only for what you can tap or have selected, gold (--hl) is
   progress and "now", green (--ok) is done, red (--margin) is a warning or a destructive action, violet (--data) is chart data. Light tokens apply only when the host sets data-theme="light". */
:root{--paper:#14111F;--paper2:#1E1A30;--paper3:#2A2442;--rule:#2F2948;--ink:#5ED6E8;--inkText:#0B1620;--text:#EDEAFB;--muted:#9E97C2;--margin:#FF5D73;--hl:#FFC54D;--hlText:#1D1503;--edge:#FF9F43;--ok:#5BE38C;--data:#9D8CFF;--scrim:rgba(6,4,14,.72);--m:56px;--g:18px;--hand:'Chakra Petch','Barlow',system-ui,sans-serif;--sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--cut:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);--cut-s:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--paper:#F2F0FA;--paper2:#FFFFFF;--paper3:#E6E2F4;--rule:#D8D3EC;--ink:#0B7A8A;--inkText:#FFFFFF;--text:#1B1730;--muted:#5D5780;--margin:#D3304C;--hl:#8A5D00;--hlText:#FFFFFF;--edge:#B65A00;--ok:#14804A;--data:#6B55E0;--scrim:rgba(20,16,40,.45);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--paper);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink);text-underline-offset:3px;text-decoration-thickness:1.5px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.page{position:relative;max-width:580px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom,0px)) 0;min-height:100vh}
.sec{display:grid;grid-template-columns:var(--m) minmax(0,1fr);column-gap:var(--g);padding:20px 0;border-top:1px solid var(--rule)}
.sec.top{border-top:0;padding-top:26px}
.mn{grid-column:1;text-align:right;padding:2px 0 0;font:600 13px/1.3 var(--hand);color:var(--muted)}
.mc{grid-column:2;min-width:0}
h1{font:700 32px/1.05 var(--hand);color:var(--text)}
h2{font:600 19px/1.3 var(--hand)}
.h3{font:600 18px/1.3 var(--hand);margin-bottom:10px}
.h4{font:600 16px/1.3 var(--hand);margin:18px 0 6px}
.sub{color:var(--muted);margin-top:6px}
.muted{color:var(--muted);font-size:15px}
.hl{color:var(--hl)}
.hmeta{color:var(--muted);font-size:14.5px}
.hero-t{position:relative;display:block;font:700 25px/1.25 var(--hand);color:var(--text);margin:6px 0 8px}
.hero-t::after{content:"";position:absolute;left:0;right:100%;top:52%;height:3px;background:var(--margin);transition:right .42s cubic-bezier(.3,.7,.3,1)}
.hero-t.cross::after{right:0}
.why{font-size:14.5px;color:var(--text);font-weight:500;margin-top:8px}
.res{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.res a{font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;background:var(--paper3);color:var(--ink);font:600 16px/1.1 var(--hand);text-align:center;clip-path:var(--cut-s)}
.btn.primary{background:var(--ink);color:var(--inkText)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.link{background:none;border:0;padding:8px 0;min-height:40px;color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-align:left}
.link.danger{color:var(--margin)}
.btn.danger{color:var(--margin)}
.btn.danger.primary{background:var(--margin);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{min-height:38px;padding:0 13px;border:0;background:var(--paper3);font:500 15px/1 var(--sans);color:var(--text);clip-path:var(--cut-s)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--inkText);font-weight:600}
.chip:disabled{opacity:.45}
.tl{margin:0 0 4px}
.tdig{display:flex;align-items:baseline;font:700 64px/1 var(--hand);color:var(--text);margin:12px 0 4px;font-variant-numeric:tabular-nums}
.tdig .d{display:inline-block;width:.6em;text-align:center}
.tdig .c{display:inline-block;width:.3em;text-align:center;color:var(--muted)}
.tline{height:6px;width:200px;background:var(--paper3);overflow:hidden;margin:4px 0 12px}
.tline i{display:block;height:100%;width:0;background:var(--ink);transition:width .5s linear}
.tline.brk i{background:var(--ok)}
.tcap{color:var(--muted);margin-bottom:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:112px;max-width:320px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0}
.wv{font:600 12px/1 var(--hand);color:var(--muted);height:13px}
.wb{flex:1;width:18px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--paper2);min-height:0}
.wb i{display:block;width:100%;background:var(--data)}
.wb i.pj,.wb i.bb,.key.pj::before,.key.bb::before{background:var(--hl)}
.keys{display:flex;gap:14px;margin-top:6px;font-size:14px;color:var(--muted)}
.key::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--data)}
.trow{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px}
.trow .chips{margin:0}
.wl{font:600 13px/1 var(--hand);color:var(--muted)}
.wd.now .wl{color:var(--text)}
.wstat{margin-top:12px}
.bad{color:var(--margin)}
.edge{color:var(--edge)}
.sync{padding:20px 0 0 calc(var(--m) + var(--g));font-size:13.5px;color:var(--muted)}
/* Progress bars are segmented like XP bars. */
.bar{display:block;height:8px;background:var(--paper2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--hl) 0 12px,transparent 12px 15px)}
.bar.low i{background:repeating-linear-gradient(90deg,var(--margin) 0 12px,transparent 12px 15px)}
.bar.ok i{background:repeating-linear-gradient(90deg,var(--ok) 0 12px,transparent 12px 15px)}
.hud{margin-top:18px;padding:14px 14px 4px;background:var(--paper2);clip-path:var(--cut)}
.hud li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding-bottom:12px}
.hud .sl{font:600 14px/1.2 var(--hand);color:var(--muted)}
.hud .sv{font:600 14px/1.2 var(--hand);color:var(--text);font-variant-numeric:tabular-nums}
.hud .bar{grid-column:1/-1;margin-top:6px;background:var(--paper)}
.hud ul{margin-top:12px}
.hstreak{display:flex;align-items:baseline;gap:8px;margin:0;font:600 15px/1 var(--hand);color:var(--muted)}
.hstreak b{font:700 30px/1 var(--hand);color:var(--hl)}
.phase{border-top:1px solid var(--rule)}
.ph{display:grid;grid-template-columns:var(--m) minmax(0,1fr) 24px;column-gap:var(--g);width:100%;text-align:left;background:none;border:0;padding:18px 0;color:inherit;align-items:start}
.ph .mn{font:700 26px/1 var(--hand);color:var(--ink);padding:0}
.ph .mn.cs{font-size:15px;line-height:1.3;padding-top:3px;overflow-wrap:anywhere}
.complete .ph .mn{color:var(--muted)}
.pname{display:block;font:600 18px/1.3 var(--hand)}
.pwhy{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.pprog{display:block;font-size:14.5px;margin-top:8px}
.chev{width:20px;height:20px;margin-top:4px;color:var(--muted);transition:transform .2s}
.ph[aria-expanded="true"] .chev{transform:rotate(180deg)}
.topics{padding-bottom:12px}
.topic{position:relative;padding:4px 0 4px calc(var(--m) + var(--g))}
.topic+.topic::before{content:"";position:absolute;top:0;left:calc(var(--m) + var(--g));right:0;border-top:1px solid var(--rule)}
/* Checkboxes sit in the left column: a square that fills green when done. */
.bead{position:absolute;left:calc(var(--m) - 30px);top:4px;width:44px;height:44px;border:0;background:none;padding:0;display:grid;place-items:center}
.bead span{width:20px;height:20px;border:2px solid var(--muted);background:var(--paper);display:grid;place-items:center;transition:background .2s,border-color .2s}
.bead[aria-pressed="true"] span,.bead.on span{background:var(--ok);border-color:var(--ok)}
.bead[aria-pressed="true"] span::after,.bead.on span::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:translateY(-1px) rotate(-45deg)}
.is-next .bead span{border-color:var(--hl)}
.tt{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 0;min-height:48px;color:inherit}
.tt.st{cursor:default;padding:12px 0}
.tname{display:block;font-weight:500;font-size:16.5px;line-height:1.35}
.is-done .tname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:3px;font-size:14px;color:var(--muted)}
.tag{font-size:13px;line-height:1;padding:4px 8px;background:var(--paper3);color:var(--muted)}
.tag.syl{color:var(--hl)}
.td{padding:0 0 14px}
.plabel{padding:16px 0 2px calc(var(--m) + var(--g));font:600 14px/1.3 var(--hand);color:var(--muted)}
.day{border-top:1px solid var(--rule);padding:4px 0 18px}
.tlr{position:relative;display:grid;grid-template-columns:var(--m) minmax(0,1fr);column-gap:var(--g);padding:10px 0}
.tlr+.tlr::before{content:"";position:absolute;top:0;left:calc(var(--m) + var(--g));right:0;border-top:1px solid var(--rule)}
.tm{padding-top:1px}
.tm span{font:600 15px/1.3 var(--hand);color:var(--text);padding:1px 4px;font-variant-numeric:tabular-nums}
.tlr.now .tm span{background:var(--hl);color:var(--hlText)}
.tlr.now .mc{box-shadow:inset 3px 0 0 var(--hl);padding-left:12px;margin-left:-12px}
.tlr.cl .mc{box-shadow:inset 3px 0 0 var(--sc);padding-left:12px;margin-left:-12px}
.tlr.past .tm span,.tlr.past:not(.cl) .ev{color:var(--muted)}
.ev{font-weight:600;font-size:16.5px;line-height:1.35}
.evt{font-weight:400;font-size:14.5px;color:var(--muted)}
.evs{font-size:14.5px;color:var(--muted);margin-top:1px}
.evs.bad{color:var(--margin)}
.evs.edge{color:var(--edge)}
.seg3{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg3 button{min-height:36px;padding:0 12px;border:0;background:var(--paper3);color:var(--text);font:600 14.5px/1 var(--sans);clip-path:var(--cut-s)}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--inkText)}
.seg3 button[data-v="p"][aria-pressed="true"]{background:var(--ok);color:var(--paper)}
.seg3 button[data-v="a"][aria-pressed="true"]{background:var(--margin);color:var(--paper)}
.seg3 button[data-v="c"][aria-pressed="true"]{background:var(--muted);color:var(--paper)}
.dayfoot{padding:6px 0 0 calc(var(--m) + var(--g));display:grid;gap:4px;justify-items:start}
.dlist li{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:start;padding:4px 0}
.ck{width:40px;height:40px;margin:-8px 0 0 -10px;border:0;background:none;padding:0;display:grid;place-items:center}
.ck span{width:20px;height:20px;border:2px solid var(--muted);display:grid;place-items:center}
.ck[aria-pressed="true"] span{background:var(--ok);border-color:var(--ok)}
.ck[aria-pressed="true"] span::after{content:"";width:8px;height:4px;border-left:2.5px solid var(--paper);border-bottom:2.5px solid var(--paper);transform:translateY(-1px) rotate(-45deg)}
.dt{font-weight:600}
.dl.done .dt{text-decoration:line-through;text-decoration-color:var(--ok);color:var(--muted)}
.ind{padding:0 0 0 calc(var(--m) + var(--g))}
.cbody{padding-bottom:16px}
.marks li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:3px 0;align-items:baseline}
.mk{font:700 18px/1 var(--hand);color:var(--hl);text-align:right}
.marks li+li{border-top:1px solid var(--rule);padding-top:6px}
.marks .link{min-height:34px;padding:4px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stv{font:700 30px/1 var(--hand);min-width:76px;text-align:center}
.subj{display:grid;grid-template-columns:var(--m) minmax(0,1fr);column-gap:var(--g);padding:4px 0;border-top:1px solid var(--rule)}
.subj .pct{padding-top:13px}
.srow .bar{margin-top:6px;height:6px}
.pct{font:700 17px/1.2 var(--hand);color:var(--ok);padding-top:1px;text-align:right}
.pct.bad{color:var(--margin)}
.pct.edge{color:var(--edge)}
.sname{display:block;font-weight:600;font-size:16.5px;overflow-wrap:anywhere}
.sst{display:block;font-size:14.5px;color:var(--muted);margin-top:1px}
.sst.bad{color:var(--margin)}
.sst.edge{color:var(--edge)}
.edit{display:grid;gap:10px;margin-top:12px;padding:14px;background:var(--paper2);clip-path:var(--cut)}
label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border-radius:0;border:1.5px solid var(--rule);background:var(--paper);color:var(--text);font-size:16px}
.edit input,.edit select,.edit textarea{background:var(--paper)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:flex;gap:8px;margin-top:6px}
.addrow input{flex:1;min-width:0}
.big{font:700 60px/1 var(--hand);color:var(--hl);margin-top:10px}
.sem .mn{font:700 20px/1.2 var(--hand);color:var(--hl);padding-top:1px}
.semh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seg{display:inline-flex;gap:4px;margin:10px 0 12px}
.seg button{border:0;background:var(--paper3);padding:0 12px;min-height:38px;font:600 14.5px/1 var(--sans);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--inkText)}
.gsubs{margin-bottom:10px}
.gsub{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;padding:10px 0;border-top:1px solid var(--rule)}
.gsub:first-child{border-top:0;padding-top:0}
.gsub .gname{grid-column:1/-1}
.x{border:0;background:none;color:var(--muted);font-size:24px;line-height:1;min-height:44px}
.sc{display:inline-flex;align-items:center;min-height:36px;padding:0 2px 0 12px;background:var(--paper3);font:600 15px/1 var(--hand);clip-path:var(--cut-s)}
.sc .x{min-height:36px;min-width:32px;font-size:20px}
.evs.dlx{color:var(--hl);font-weight:500}
.ahead .tm span{display:inline-block;text-align:right;line-height:1.15}
.nt{margin-top:10px}
.nt>summary{cursor:pointer;color:var(--ink);font-weight:600;padding:8px 0}
.nt ul{list-style:disc;padding-left:20px}
.nt li{margin:5px 0}
.pq{list-style:decimal!important;padding-left:22px!important}
.pq>li{margin:10px 0}
.pq summary{cursor:pointer;color:var(--muted);font-size:14.5px;padding:6px 0}
.pq details p{background:var(--paper2);padding:8px 10px}
.nt code{font-family:var(--mono);font-size:.86em;background:var(--paper3);padding:1px 5px;overflow-wrap:anywhere}
.pq details code{background:var(--paper3)}
.sgl{margin-top:10px}
.plan{margin-top:12px;font-weight:500}
.wk{display:flex;gap:6px;margin-top:12px}
.wk span{display:grid;place-items:center;width:34px;height:34px;background:var(--paper2);font:700 14px/1 var(--hand);color:var(--muted);clip-path:var(--cut-s)}
.wk .on{background:var(--ok);color:var(--paper)}
.wk .now:not(.on){background:var(--paper3);color:var(--ink)}
.dots{display:flex;align-items:center;flex-wrap:wrap;margin:0 0 0 -8px}
.dot{width:36px;height:40px;border:0;background:none;padding:0;display:grid;place-items:center}
.dot span{width:13px;height:13px;border:1.5px solid var(--muted)}
.dot[aria-pressed="true"] span{background:var(--ok);border-color:var(--ok)}
.dots .evs{margin:0 0 0 6px}
.wnow{font:700 40px/1 var(--hand);color:var(--text);margin-top:10px}
.wnow small{font-size:20px;color:var(--muted)}
.chart{display:block;width:100%;max-width:360px;height:auto;margin-top:12px}
.chart text{fill:var(--muted);font:600 12px var(--hand)}
.chart .gr{stroke:var(--rule);stroke-width:1}
.chart .ar{fill:var(--data);opacity:.14}
.chart .ln{fill:none;stroke:var(--data);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .gl{stroke:var(--hl);stroke-width:1.5;stroke-dasharray:5 4}
.chart .gt{fill:var(--hl)}
.chart circle{fill:var(--data);stroke:var(--paper);stroke-width:2}
.lifts li{padding:4px 0}
.lifts li+li{border-top:1px solid var(--rule)}
textarea{resize:vertical;line-height:1.45}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper2);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{max-width:580px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
body.setup .tabs{display:none}
.tab[hidden]{display:none}
.ck:disabled{opacity:.45;cursor:default}
a.btn{text-decoration:none}
.btn.off{opacity:.4;pointer-events:none}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;min-height:58px;border:0;background:none;color:var(--muted);font:600 12.5px/1 var(--hand)}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;width:34px;height:3px;background:var(--ink)}
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30;width:min(540px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:6px 6px 6px 16px;background:var(--paper3);color:var(--text);font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.45);clip-path:var(--cut)}
.snack[hidden]{display:none}
.snack .btn{color:var(--hl);background:transparent;flex:none}
.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:620px;height:88vh;height:88dvh;max-height:780px;background:var(--paper);border-top:2px solid var(--ink);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);outline:none}
.sh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:18px 16px 8px}
.sh h2{font:700 22px/1.25 var(--hand);color:var(--text)}
.qk{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.qk::-webkit-scrollbar{display:none}

/* v33 polish: the page sits on a faint HUD grid with two soft glows; every block is a cut-corner card on it. Nested panels inside a card use --paper so they still read as recessed. */

.card .edit{background:color-mix(in srgb,var(--paper) 80%,var(--card));box-shadow:inset 0 0 0 1px var(--rule)}

.card .cd.hol{background:var(--paper3)}
.sec.top{padding:22px 4px 8px 0}

.btn:hover:not(:disabled){filter:brightness(1.1)}

.chip,.seg3 button,.cd{transition:transform .12s,background .15s,color .15s}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--ink) 75%,var(--data)))}
.pop{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}

.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;margin:4px -10px 0;padding:10px;background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.subnav>div,.chips.segnav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;background:var(--card);clip-path:var(--cut-s)}

.subnav button{position:relative;min-height:44px;border:0;background:none;color:var(--muted);font:600 14px/1.1 var(--hand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;clip-path:var(--cut-s);transition:background .15s,color .15s}

.sumrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.mark-all{margin:4px 0 6px}
.dayfoot .btn{margin-bottom:4px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-top:12px}
.cw{font:600 12px/1 var(--hand);color:var(--muted);text-align:center;padding:4px 0}

.cd .hh{font:600 10px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:32px}

.dots i.p{background:var(--ok)}.dots i.a{background:var(--margin)}.dots i.c{background:var(--muted)}.dots i.u{background:none;box-shadow:inset 0 0 0 1.5px var(--muted)}
.key.kp::before{background:var(--ok)}.key.ka::before{background:var(--margin)}.key.ku::before{background:none;box-shadow:inset 0 0 0 1.5px var(--muted)}.key.kh::before{background:var(--hl)}

.edit textarea{min-height:88px;resize:vertical}

/* v34 layout: no side-label column. Section labels become small gold eyebrows above the content, and vanish when the content already opens with a heading. */
:root{--m:52px;--g:12px}

.bs-head::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;background:var(--rule)}
.bs-head h2{font:700 21px/1.25 var(--hand);overflow-wrap:anywhere}
.bs-body{overflow-y:auto;padding:6px 16px 20px;display:grid;gap:12px}
.bs-body .edit{background:none;box-shadow:none;clip-path:none;padding:0;margin:0}
.bs-body .edit>h3:first-child{display:none}
.bs-stat{display:flex;align-items:center;gap:12px;padding:12px;background:var(--paper);clip-path:var(--cut-s)}
.bs-stat b{font:700 30px/1 var(--hand);color:var(--ok);font-variant-numeric:tabular-nums}
.bs-stat b.edge{color:var(--edge)}.bs-stat b.bad{color:var(--margin)}
.bs-stat span{font-size:14.5px;color:var(--text)}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:78px;padding:12px;border:0;background:var(--paper3);color:var(--text);text-align:left;clip-path:var(--cut-s);transition:transform .12s}
.act b{font:700 16.5px/1.2 var(--hand);color:var(--ink)}
.act span{font-size:13.5px;color:var(--muted);line-height:1.3}
.act:active{transform:scale(.96)}
.act:last-child:nth-child(odd){grid-column:1/-1}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.bs-panel,.bs-scrim,.enter .w{animation:none!important}}
/* v35: nothing smaller than 11px, room below lists for the add button, the weekly summary, and the food day switcher. */
.mn,.w-eb,.ring span,.pill,.dchip span{font-size:12px}
.subnav .bd{font-size:11px}
.cd .hh{font-size:11px}
body:has(.fab) .page{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.rep{display:grid;gap:8px;margin-top:4px}
.rep li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:baseline;font-size:15px}
.rep li span:first-child{font:600 12px/1.3 var(--hand);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fday{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.fday .btn{min-width:44px}
.w .btns{margin-top:8px}
.w .btns .link{min-height:36px;padding:4px 0}
/* v36: Health day switcher, meals, water, habit history, skip planner, report header. */
.hday{flex:1;text-align:center;font:600 15px/1.2 var(--hand);color:var(--muted)}
.hday.hl{color:var(--hl)}
.mealh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 0 2px;font:600 12px/1.2 var(--hand);letter-spacing:.1em;text-transform:uppercase;color:var(--hl)}
.mealh span{font:500 13.5px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
.wtr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wtr p{display:flex;align-items:baseline;gap:6px;font-size:15px;color:var(--muted)}
.wtr b{font:700 34px/1 var(--hand);color:var(--text);font-variant-numeric:tabular-nums}
.wnote{margin:0 0 12px}
.wnote textarea{min-height:64px}
.hhist{margin-top:4px}
.hg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:300px;margin-top:6px}
.hg i{display:block;height:18px;background:var(--paper3);clip-path:var(--cut-s)}
.hg i.on{background:var(--ok)}
.hg i.f{background:none;box-shadow:inset 0 0 0 1px var(--rule)}
.hg i.now{box-shadow:inset 0 0 0 2px var(--hl)}
.hg.hd{margin-top:10px}
.hg.hd span{font:600 11px/1 var(--hand);color:var(--muted);text-align:center}
.skip li{grid-template-columns:52px minmax(0,1fr)}
.skip .mk{color:var(--ok)}.skip .mk.edge{color:var(--edge)}.skip .mk.bad{color:var(--margin)}
.rephead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 0 8px}
.w.exam{background:linear-gradient(135deg,color-mix(in srgb,var(--hl) 22%,var(--card)),var(--card) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hl) 35%,transparent)}
.w.exam .w-big{color:var(--hl)}
.dl .dots{max-width:none;justify-content:flex-start;gap:0}
.subj .pct:not(.ok):not(.edge):not(.bad){color:var(--muted)}
</style>
</head>

  if (f === 'rProjMin') { if (PMIN.includes(+el.value)) { S.routine.projectMin = +el.value; commit(false); } return; }
  if (f === 'rGym' || f === 'rProject' || f === 'rStudy' || f === 'rSleep') { const v = el.value; if (v === '' || TIME.test(v)) { S.routine[{ rGym: 'gym', rProject: 'project', rStudy: 'study', rSleep: 'sleep' }[f]] = v; commit(false); } return; }
  if (f === 'gName' || f === 'gEx' || f === 'gNote') { const p = planOf(el.dataset.id); if (!p) return; if (f === 'gName') p.name = el.value.slice(0, 30); else if (f === 'gNote') p.note = el.value.slice(0, 250); else p.ex = exParse(el.value); commit(false); return; }
  if (f === 'gDays') { S.gym.days = Math.min(7, Math.max(1, +el.value || 3)); commit(false); return; }
  if (f === 'hName') { const x = S.health.habits.find(y => y.id === el.dataset.id); if (x) { x.name = el.value.slice(0, 60); commit(false); } return; }
  if (f === 'pAge' || f === 'pH' || f === 'pKg' || f === 'pSex' || f === 'pAct' || f === 'pGoal') {
    const P = S.health.prof, v = el.value;
    if (f === 'pAge') { const a = num(v, 12, 90); if (a !== null) P.born = new Date().getFullYear() - Math.round(a); }
    else if (f === 'pH') { const h = num(v, 120, 230); if (h !== null) P.h = Math.round(h); }
    else if (f === 'pKg') { const kg = num(v, 25, 250); if (kg !== null) P.kg = Math.round(kg * 10) / 10; }
    else if (f === 'pSex') P.sex = v === 'f' ? 'f' : 'm';
    else if (f === 'pAct') { if (ACT[v]) P.act = v; }
    else if (GOALS[v]) P.goal = v;
    P.set = true;
    commit(false);
    const t = $('#tgt');
    if (t) t.innerHTML = tgtText();
    return;
  }
  if (f === 'wGoal') { S.health.goal = el.value === '' ? null : num(el.value, 20, 300); commit(false); const w = $('#wInfo'); if (w) w.innerHTML = wInfo(); return; }
});
app.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'newSub') { e.preventDefault(); addSub(); }
  if (e.target.id === 'dlT') { e.preventDefault(); const f = e.target.closest('.edit'), b = f && f.querySelector('[data-act="dlSave"]'); if (b) dlSave(b.dataset.id, f); else A.dlAdd(e.target); }
  if ((e.target.id === 'gK' || e.target.id === 'gR') && ui.gEx) { e.preventDefault(); gymAdd(ui.gEx); }
  if (e.target.id === 'wIn' || e.target.id === 'waIn') { e.preventDefault(); wAdd(); }
  if (['fN', 'fK', 'fP'].includes(e.target.id)) { e.preventDefault(); fCustom(); }
  if (['carN', 'carM', 'carK'].includes(e.target.id)) { e.preventDefault(); carAdd(); }
  if (['feN', 'feK', 'feP'].includes(e.target.id)) { e.preventDefault(); fSave(ui.fOpen); }
  if (['fmN', 'fmK', 'fmP'].includes(e.target.id)) { e.preventDefault(); fMySave(ui.fMy); }
  if (e.target.id === 'newHabit') { e.preventDefault(); hAdd(); }
  if (e.target.id === 'newGoal') { e.preventDefault(); goalAdd(); }
  if (e.target.dataset && e.target.dataset.exadd) { e.preventDefault(); gymExAdd(e.target.dataset.exadd); }
  if (e.target.id === 'exRen' && ui.lift) { e.preventDefault(); exRename(ui.lift); }
});
app.addEventListener('focusout', () => setTimeout(() => { if (pending && !editing()) { const x = pending; pending = null; if ((+x.updatedAt || 0) > S.updatedAt) adopt(x); } }, 0));
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else { if (ui.timer && ui.timer.endsAt) wake(true); if (!checkT() && ui.tab === 'today' && !editing()) render(); } });
window.addEventListener('pagehide', () => { flush(); });
setInterval(() => { if (ui.tab === 'today' && !editing() && !document.hidden) { const d = $('.day'); if (d) { const t = d.querySelector('.tl'); if (t) t.innerHTML = dayRows(new Date()); } const g = $('.wg'); if (g && !ui.bs) g.outerHTML = widgets(new Date()); } }, 60000);

render();
checkT();
setInterval(tick, 500);
connect();
})();
</script>
<script>'serviceWorker' in navigator && addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
